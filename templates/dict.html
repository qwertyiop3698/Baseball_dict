<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야구용어 백과사전</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: #f5f7fb;
            color: #172033;
            overflow: hidden;
        }
        .sidebar {
            width: 340px;
            padding: 28px 20px;
            background: #ffffff;
            border-right: 1px solid #dde3ee;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .sidebar h2 {
            margin: 0;
            color: #00458d;
            font-size: 22px;
            text-align: center;
        }
        .sidebar-subtitle {
            margin: 0;
            color: #667389;
            line-height: 1.6;
            text-align: center;
            font-size: 14px;
        }
        .example-panel {
            min-height: 0;
            overflow-y: auto;
        }
        .example-title {
            display: block;
            margin-bottom: 10px;
            color: #303b4f;
            font-size: 14px;
            font-weight: 800;
        }
        .example-list {
            display: grid;
            gap: 8px;
        }
        .example-btn {
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid #d8e3f2;
            border-radius: 8px;
            background: #eef4fb;
            color: #172033;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }
        .example-btn:hover {
            border-color: #00458d;
            color: #00458d;
        }
        .compare-btn {
            margin-top: auto;
            display: block;
            padding: 14px;
            border: 2px solid #00458d;
            border-radius: 8px;
            color: #00458d;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
        }
        .compare-btn:hover {
            background: #00458d;
            color: #ffffff;
        }
        .main-container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        #answer-container {
            flex: 1;
            overflow-y: auto;
            padding: 44px 10%;
        }
        #answer {
            max-width: 860px;
            margin: 0 auto;
            line-height: 1.8;
            font-size: 16px;
        }
        #answer h1,
        #answer h2,
        #answer h3 {
            color: #00458d;
        }
        .input-area {
            padding: 18px 10%;
            border-top: 1px solid #e8edf5;
        }
        .input-box {
            max-width: 860px;
            margin: 0 auto;
            background: #eef4fb;
            border: 1px solid #d8e3f2;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            padding: 12px;
            font-size: 16px;
            background: transparent;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 0 22px;
            background: #00458d;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }
        @media (max-width: 760px) {
            body {
                height: auto;
                min-height: 100vh;
                flex-direction: column;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #dde3ee;
            }
            .example-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>야구용어 백과사전</h2>
        <p class="sidebar-subtitle">규칙, 기록 지표, 전술, 포지션처럼 야구용어만 검색할 수 있습니다.</p>

        <div class="example-panel">
            <span class="example-title">예시 검색어</span>
            <div class="example-list">
                <button class="example-btn" type="button">OPS가 뭐야?</button>
                <button class="example-btn" type="button">WHIP 뜻 알려줘</button>
                <button class="example-btn" type="button">퀄리티 스타트란?</button>
                <button class="example-btn" type="button">희생번트와 희생플라이 차이</button>
                <button class="example-btn" type="button">병살타가 뭐야?</button>
                <button class="example-btn" type="button">인필드 플라이 설명해줘</button>
                <button class="example-btn" type="button">세이브 조건 알려줘</button>
                <button class="example-btn" type="button">WAR은 어떤 지표야?</button>
                <button class="example-btn" type="button">ERA와 FIP 차이</button>
                <button class="example-btn" type="button">보크가 뭔데?</button>
            </div>
        </div>

        <a href="/compare" class="compare-btn">선수 비교 분석</a>
    </aside>

    <main class="main-container">
        <div id="answer-container">
            <div id="answer">
                <h1>야구용어 백과사전</h1>
                <p>궁금한 야구용어를 입력하면 뜻, 쓰이는 상황, 비슷한 용어와의 차이를 쉽게 설명해드립니다.</p>
                <p>선수 비교는 왼쪽 하단의 <b>선수 비교 분석</b> 버튼에서 이용해주세요.</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="question" placeholder="예: OPS가 뭐야?">
                <button id="send-button" type="button">검색</button>
            </div>
        </div>
    </main>

    <script>
        const input = document.getElementById("question");
        const sendButton = document.getElementById("send-button");
        const answer = document.getElementById("answer");
        const examples = document.querySelectorAll(".example-btn");

        async function readJsonResponse(response) {
            const text = await response.text();
            if (!text) {
                throw new Error(`서버가 빈 응답을 반환했습니다. (${response.status})`);
            }

            try {
                return JSON.parse(text);
            } catch (error) {
                throw new Error(`서버 응답이 JSON 형식이 아닙니다. (${response.status})`);
            }
        }

        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            answer.innerHTML = "<b>검색 중입니다...</b>";
            sendButton.disabled = true;

            try {
                const isStaticPage =
                    window.location.protocol === "file:" ||
                    window.location.port === "5500" ||
                    window.location.hostname.endsWith("github.io");
                if (isStaticPage) {
                    throw new Error("Flask 서버로 접속해야 검색할 수 있습니다. python app.py를 실행한 뒤 http://127.0.0.1:5000 주소로 접속해 주세요.");
                }

                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                const data = await readJsonResponse(response);
                answer.innerHTML = data.answer || "답변이 비어 있습니다.";
            } catch (e) {
                const isFetchFailure = e instanceof TypeError && e.message === "Failed to fetch";
                answer.textContent = isFetchFailure
                    ? "오류 발생: Flask 서버에 연결할 수 없습니다. python app.py를 실행한 뒤 http://127.0.0.1:5000 주소로 접속해 주세요."
                    : `오류 발생: ${e.message}`;
            } finally {
                sendButton.disabled = false;
                input.value = "";
                input.focus();
            }
        }

        examples.forEach((button) => {
            button.addEventListener("click", () => {
                input.value = button.textContent.trim();
                input.focus();
            });
        });

        sendButton.addEventListener("click", sendQuestion);
        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
